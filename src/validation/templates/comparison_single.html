<!DOCTYPE html>
<html>
<head>
    <title>XPath Comparison - {serp_id}</title>
    <style>
        * {{ margin: 0; padding: 0; box-sizing: border-box; }}
        body {{ font-family: sans-serif; }}
        .header {{ background: #333; color: #fff; padding: 10px 16px; font-size: 13px; }}
        .header code {{ background: #555; padding: 2px 6px; border-radius: 3px; font-size: 12px; }}
        .container {{ display: flex; height: calc(100vh - 40px); }}
        .pane {{ flex: 1; display: flex; flex-direction: column; border-right: 2px solid #666; }}
        .pane:last-child {{ border-right: none; }}
        .label {{ padding: 8px 12px; font-size: 13px; font-weight: bold; border-bottom: 2px solid #ddd; }}
        .annotated .label {{ background: #e8f5e9; color: #2e7d32; }}
        .parsed .label {{ background: #fff3e0; color: #e65100; }}
        iframe {{ flex: 1; border: none; }}
    </style>
</head>
<body>
    <div class="header">
        SERP: <code>{serp_id}</code> | XPath: <code>{xpath}</code> | Reason: <code>{failure_reason}</code>
    </div>
    <div class="container">
        <div class="pane annotated">
            <div class="label">Ground Truth (Annotated)</div>
            <iframe id="gt-frame" src="file://{gt_path}"></iframe>
        </div>
        <div class="pane parsed">
            <div class="label">XPath Extraction</div>
            <iframe id="xp-frame" src="file://{xp_path}"></iframe>
        </div>
    </div>
    <script>
        function scrollToHighlight(iframe, selector) {{
            iframe.addEventListener('load', function() {{
                try {{
                    var el = iframe.contentDocument.querySelector(selector);
                    if (el) el.scrollIntoView({{ behavior: 'smooth', block: 'center' }});
                }} catch(e) {{}}
            }});
        }}
        scrollToHighlight(document.getElementById('gt-frame'), '#fb-scroll-target');
        scrollToHighlight(document.getElementById('xp-frame'), '[style*="ff5722"]');
    </script>
</body>
</html>
